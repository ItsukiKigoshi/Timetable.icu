stages:
  - sync

sync_courses:
  stage: sync
  image: mcr.microsoft.com/playwright/python:v1.49.0-noble # Pre-built image with Playwright & Node.js
  only:
    - schedules # Run via scheduled pipeline
    - main
  variables:
    ICUMAP_USER: $ICUMAP_USER
    ICUMAP_PASSWORD: $ICUMAP_PASSWORD
    CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
    CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - pip install uv
    - uv sync
  script:
    # 1. Fetch HTML from icuMAP
    - uv run python scripts/fetch_icumap.py

    # 2. Parse HTML to dist_courses.json
    - uv run python parse_icumap.py

    # 3. Generate SQL statements from JSON
    - uv run python to_sql.py

    # 4. Execute upsert SQL queries on Cloudflare D1
    - npx wrangler d1 execute timetable_icu --remote --file=scripts/out/sync_courses.sql

    # 5. Update last updated timestamp in Cloudflare D1
    - |
      TIMESTAMP=$(date -u +"%Y-%m-%d_T%H:%M:%SZ")
      npx wrangler d1 execute timetable_icu --remote --command="INSERT INTO meta_settings (key, value) VALUES ('courseLastUpdatedAt', '$TIMESTAMP') ON CONFLICT(key) DO UPDATE SET value=excluded.value;"